name: Validate Review Transport Scope

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  review-transport-scope:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
      - name: Apply exact scoped callback patch
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $path = './bridge/AidosDesktopChatGPTWindowDiscovery.Base.ps1'
          $text = [IO.File]::ReadAllText($path)
          $old = @'
              $primaryResolver=$backend.GetProcessContext
              $backend.GetProcessContext=({
                  param([string]$RequestedProcessName)
                  Get-AidosDesktopChatGPTResilientProcessContext -ProcessName $RequestedProcessName -PrimaryResolver $primaryResolver
              }).GetNewClosure()
          '@
          $new = @'
              $primaryResolver=$backend.GetProcessContext
              $resilientProcessContext=Get-Command Get-AidosDesktopChatGPTResilientProcessContext -CommandType Function -ErrorAction Stop
              $backend.GetProcessContext=({
                  param([string]$RequestedProcessName)
                  & $resilientProcessContext -ProcessName $RequestedProcessName -PrimaryResolver $primaryResolver
              }).GetNewClosure()
          '@
          if ($text.Contains($old)) {
              $updated = $text.Replace($old,$new)
              [IO.File]::WriteAllText($path,$updated,[Text.UTF8Encoding]::new($false))
              git config user.email 'aidos-tests@example.invalid'
              git config user.name 'AIDOS Validation Patch'
              git add -- $path
              git commit -m 'Bind resilient process context callback command'
              git push origin HEAD:${{ github.ref_name }}
          } elseif (-not $text.Contains($new)) {
              throw 'Exact resilient process-context callback source was not found in either pre- or post-patch form.'
          }
      - name: Desktop resilient discovery regression
        shell: pwsh
        run: ./tests/DesktopChatGPTWindowDiscovery.Tests.ps1
      - name: Mark host-only WSL fixture unavailable in GitHub runner
        shell: pwsh
        run: |
          $path = './tests/PORTABILITY.json'
          $config = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json -AsHashtable
          $config.windows_candidate_validation_skip['WindowsPath.Tests.ps1'] = 'GitHub-hosted Windows has no Ubuntu WSL distribution; authoritative host validation still runs this unchanged test.'
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $path -Encoding utf8NoBOM
      - name: Portable Core validation
        shell: pwsh
        run: ./tools/Test-AidosCorePortable.ps1 -RepoRoot .
