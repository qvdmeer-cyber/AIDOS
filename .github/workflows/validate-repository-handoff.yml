name: Validate Repository Handoff Bridge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repository-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $paths = @(
            'bridge/AidosRepositoryHandoff.psm1',
            'bridge/AidosRepositoryHandoffSignal.psm1',
            'bridge/AidosRepositoryHandoffPersistence.psm1',
            'bridge/AidosRepositoryHandoffOpenApi.psm1',
            'bridge/AidosRepositoryHandoffInstallation.psm1',
            'bridge/Refresh-AidosRepositoryHandoffGptConfig.ps1',
            'bridge/Invoke-AidosRepositoryHandoffHost.ps1',
            'bridge/Invoke-AidosRepositoryHandoffHostBootstrap.ps1',
            'bridge/AidosRepositoryActorHandoff.psm1',
            'bridge/AidosRepositoryWorkerHandoff.psm1',
            'bridge/AidosRepositoryReviewHandoff.psm1',
            'bridge/AidosRepositoryHandoffGateway.psm1',
            'bridge/AidosRepositoryThinkerBinding.psm1',
            'bridge/AidosRepositoryHumanInputTransport.psm1',
            'bridge/AidosRepositoryHandoffBridge.psm1',
            'bridge/AidosRuntimeActorAssignments.psm1',
            'bridge/AidosRuntimeActorResultConsumer.psm1',
            'bridge/AidosRuntimeProjectManager.psm1',
            'bridge/AidosDefinitionResultConsumer.psm1',
            'tests/RepositoryHandoff.Tests.ps1',
            'tests/RepositoryHandoffPersistence.Tests.ps1',
            'tests/RepositoryHandoffOpenApi.Tests.ps1',
            'tests/RepositoryHandoffInstallation.Tests.ps1',
            'tests/RepositoryGptConfigRefresh.Tests.ps1',
            'tests/RepositoryHandoffBootstrap.Tests.ps1',
            'tests/RepositoryHandoffWslProvider.Tests.ps1',
            'tests/RepositoryHandoffGatewayAtomicWrite.Tests.ps1',
            'tests/RepositoryHandoffBridgeAtomicWrite.Tests.ps1',
            'tests/RepositoryHandoffNestedRuntimeRouting.Tests.ps1',
            'tests/RepositoryRuntimeActorPending.Tests.ps1',
            'tests/RepositoryDefinitionApplicabilityCompatibility.Tests.ps1',
            'tests/RepositoryProjectApplicabilityDefinitionGate.Tests.ps1',
            'tests/RepositoryDefinitionProjectSourceAllowlist.Tests.ps1',
            'tests/RepositoryDefinitionOptionalResultProperties.Tests.ps1',
            'tests/RepositoryHumanInputTransport.Tests.ps1',
            'tests/RepositoryHumanInputGateway.Tests.ps1',
            'tests/RepositoryWorkerHandoff.Tests.ps1',
            'tests/RepositoryWorkerRuntimeIntegration.Tests.ps1',
            'tests/RepositoryHandoffGateway.Tests.ps1',
            'tests/RepositoryThinkerBinding.Tests.ps1',
            'tests/RepositoryThinkerCustomGptBinding.Tests.ps1',
            'tests/RepositoryThinkerOptionalLegacyPattern.Tests.ps1',
            'tests/RepositoryThinkerMarkdownNormalization.Tests.ps1',
            'tests/RepositoryThinkerRetryTimestamp.Tests.ps1',
            'tests/RepositoryCurrentThinkerTriggerGuard.Tests.ps1',
            'tests/RepositoryHandoffBridge.Tests.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "${path}: $($errors.Message -join '; ')" }
          }
      - name: Repository handoff contract
        shell: pwsh
        run: ./tests/RepositoryHandoff.Tests.ps1
      - name: Scoped repository handoff persistence
        shell: pwsh
        run: ./tests/RepositoryHandoffPersistence.Tests.ps1
      - name: GPT Action OpenAPI contract
        shell: pwsh
        run: ./tests/RepositoryHandoffOpenApi.Tests.ps1
      - name: Repository handoff host installation model
        shell: pwsh
        run: ./tests/RepositoryHandoffInstallation.Tests.ps1
      - name: Safe GPT configuration refresh
        shell: pwsh
        run: ./tests/RepositoryGptConfigRefresh.Tests.ps1
      - name: Repository handoff host bootstrap
        shell: pwsh
        run: ./tests/RepositoryHandoffBootstrap.Tests.ps1
      - name: WSL provider metadata compatibility
        shell: pwsh
        run: ./tests/RepositoryHandoffWslProvider.Tests.ps1
      - name: Gateway atomic status overwrite
        shell: pwsh
        run: ./tests/RepositoryHandoffGatewayAtomicWrite.Tests.ps1
      - name: Bridge atomic status overwrite
        shell: pwsh
        run: ./tests/RepositoryHandoffBridgeAtomicWrite.Tests.ps1
      - name: Nested WSL-safe handoff routing
        shell: pwsh
        run: ./tests/RepositoryHandoffNestedRuntimeRouting.Tests.ps1
      - name: Completed actor assignment dispatch guard
        shell: pwsh
        run: ./tests/RepositoryRuntimeActorPending.Tests.ps1
      - name: Definition applicability compatibility
        shell: pwsh
        run: ./tests/RepositoryDefinitionApplicabilityCompatibility.Tests.ps1
      - name: Project applicability before Definition
        shell: pwsh
        run: ./tests/RepositoryProjectApplicabilityDefinitionGate.Tests.ps1
      - name: Definition project identity source allowlist
        shell: pwsh
        run: ./tests/RepositoryDefinitionProjectSourceAllowlist.Tests.ps1
      - name: Optional Definition result properties
        shell: pwsh
        run: ./tests/RepositoryDefinitionOptionalResultProperties.Tests.ps1
      - name: ChatGPT Human Input transport
        shell: pwsh
        run: ./tests/RepositoryHumanInputTransport.Tests.ps1
      - name: Human Input gateway roundtrip
        shell: pwsh
        run: ./tests/RepositoryHumanInputGateway.Tests.ps1
      - name: Repository Worker handoff
        shell: pwsh
        run: ./tests/RepositoryWorkerHandoff.Tests.ps1
      - name: Guarded Worker runtime integration
        shell: pwsh
        run: ./tests/RepositoryWorkerRuntimeIntegration.Tests.ps1
      - name: Repository handoff gateway
        shell: pwsh
        run: ./tests/RepositoryHandoffGateway.Tests.ps1
      - name: Project Thinker binding and trigger
        shell: pwsh
        run: ./tests/RepositoryThinkerBinding.Tests.ps1
      - name: Custom GPT Thinker binding
        shell: pwsh
        run: ./tests/RepositoryThinkerCustomGptBinding.Tests.ps1
      - name: Optional legacy UIA pattern
        shell: pwsh
        run: ./tests/RepositoryThinkerOptionalLegacyPattern.Tests.ps1
      - name: Thinker markdown marker normalization
        shell: pwsh
        run: ./tests/RepositoryThinkerMarkdownNormalization.Tests.ps1
      - name: Thinker retry timestamp parsing
        shell: pwsh
        run: ./tests/RepositoryThinkerRetryTimestamp.Tests.ps1
      - name: Current Thinker trigger dispatch guard
        shell: pwsh
        run: ./tests/RepositoryCurrentThinkerTriggerGuard.Tests.ps1
      - name: Unified preparation and runtime bridge
        shell: pwsh
        run: ./tests/RepositoryHandoffBridge.Tests.ps1
