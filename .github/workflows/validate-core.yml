name: Validate AIDOS Core

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable-core-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem . -Recurse -File | Where-Object { $_.Extension -in @('.ps1','.psm1') } | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Syntax errors in $($_.FullName):"
              $errors | ForEach-Object { Write-Host $_.Message }
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
      - name: Parse JSON contracts/catalogs
        shell: pwsh
        run: |
          Get-ChildItem . -Recurse -Filter *.json -File | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json -Depth 100 | Out-Null
          }
      - name: Core orchestration contract tests
        shell: pwsh
        run: ./tests/CoreOrchestrationContracts.Tests.ps1
      - name: Auto Define regression tests
        shell: pwsh
        run: ./tests/AutoDefine.Tests.ps1
      - name: Operator API regression tests
        shell: pwsh
        run: ./tests/OperatorApi.Tests.ps1
      - name: Human Input regression tests
        shell: pwsh
        run: ./tests/HumanInput.Tests.ps1
      - name: Project Registry regression tests
        shell: pwsh
        run: ./tests/ProjectRegistry.Tests.ps1
      - name: Preparation Runtime regression tests
        shell: pwsh
        run: ./tests/PreparationRuntime.Tests.ps1
      - name: Preparation Dispatcher regression tests
        shell: pwsh
        run: ./tests/PreparationDispatcher.Tests.ps1
      - name: Preparation Acceptance regression tests
        shell: pwsh
        run: ./tests/PreparationAcceptance.Tests.ps1
      - name: Remote Preparation Control regression tests
        shell: pwsh
        run: ./tests/PreparationRemoteControl.Tests.ps1
