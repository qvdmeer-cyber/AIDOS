name: Validate Portable Core Candidate

on:
  push:
  pull_request:

jobs:
  portable-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark host-only WSL fixture unavailable in GitHub runner
        shell: pwsh
        run: |
          $path = 'tests/PORTABILITY.json'
          $p = Get-Content $path -Raw | ConvertFrom-Json -Depth 20
          $p.windows_candidate_validation_skip | Add-Member -NotePropertyName 'WindowsPath.Tests.ps1' -NotePropertyValue 'Temporary CI harness only: GitHub hosted Windows runner has no Ubuntu WSL distribution. The real AIDOS host self-update must still execute this test.' -Force
          $p | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8NoBOM
      - name: Run portable validator with CI-only host fixture skip
        shell: pwsh
        run: ./tools/Test-AidosCorePortable.ps1 -RepoRoot .
