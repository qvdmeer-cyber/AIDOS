name: Validate Classic Response Capture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classic-response-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/self-update-preserve-and-fresh-hydration
          fetch-depth: 0
      - name: Apply self-update and hydration fix
        shell: bash
        run: python tools/TEMP-PatchSelfUpdateAndHydration.py
      - name: Validate targeted contracts
        shell: pwsh
        run: |
          $paths=@(
            'bridge/AidosRepositoryThinkerBinding.psm1',
            'tools/Install-AidosHostSelfUpdate.ps1',
            'tools/Reload-AidosAutonomousPreparation.ps1',
            'tools/Invoke-AidosHostSelfUpdate.ps1',
            'tests/RepositoryThinkerBinding.Tests.ps1',
            'tests/HostSelfUpdateContract.Tests.ps1'
          )
          foreach($path in $paths){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "${path}: $($errors.Message -join '; ')"}
          }
          ./tests/RepositoryThinkerBinding.Tests.ps1
          ./tests/HostSelfUpdateContract.Tests.ps1
      - name: Commit intended fix
        shell: bash
        run: |
          git add -- \
            bridge/AidosRepositoryThinkerBinding.psm1 \
            tools/Install-AidosHostSelfUpdate.ps1 \
            tools/Reload-AidosAutonomousPreparation.ps1 \
            tools/Invoke-AidosHostSelfUpdate.ps1 \
            tests/RepositoryThinkerBinding.Tests.ps1 \
            tests/HostSelfUpdateContract.Tests.ps1
          if git diff --cached --quiet; then
            echo "No intended changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Preserve self-update task and rebind composer hydration"
            git pull --rebase origin fix/self-update-preserve-and-fresh-hydration
            git push origin HEAD:fix/self-update-preserve-and-fresh-hydration
          fi
      - name: Actor response extraction regression
        shell: pwsh
        run: ./tests/DesktopActorResponseExtraction.Tests.ps1
      - name: Parent message-range recovery regression
        shell: pwsh
        run: ./tests/DesktopActorMessageRangeRecovery.Tests.ps1
      - name: Desktop review authority regression
        shell: pwsh
        run: ./tests/DesktopReviewAuthority.Tests.ps1
      - name: Independent review authority recovery regression
        shell: pwsh
        run: ./tests/ReviewAuthorityRecovery.Tests.ps1
