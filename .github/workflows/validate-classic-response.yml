name: Validate Classic Response Capture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classic-response-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capture-runtime-review-publisher-command
          fetch-depth: 0
      - name: Apply runtime review publisher closure fix
        shell: bash
        run: python tools/TEMP-CaptureRuntimeReviewPublisherCommand.py
      - name: Validate runtime review publisher closure
        shell: pwsh
        run: |
          $paths=@('bridge/AidosRepositoryHandoffBridge.psm1','tests/RepositoryHandoffBridge.Tests.ps1')
          foreach($path in $paths){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "${path}: $($errors.Message -join '; ')"}
          }
          ./tests/RepositoryHandoffBridge.Tests.ps1
          ./tests/RuntimeProjectManager.Tests.ps1
      - name: Commit runtime review publisher closure fix
        shell: bash
        run: |
          git add -- bridge/AidosRepositoryHandoffBridge.psm1 tests/RepositoryHandoffBridge.Tests.ps1
          if git diff --cached --quiet; then
            echo "No runtime review publisher closure changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Capture runtime review publisher command"
            git push origin HEAD:fix/capture-runtime-review-publisher-command
          fi
      - name: Actor response extraction regression
        shell: pwsh
        run: ./tests/DesktopActorResponseExtraction.Tests.ps1
      - name: Parent message-range recovery regression
        shell: pwsh
        run: ./tests/DesktopActorMessageRangeRecovery.Tests.ps1
      - name: Desktop review authority regression
        shell: pwsh
        run: ./tests/DesktopReviewAuthority.Tests.ps1
      - name: Independent review authority recovery regression
        shell: pwsh
        run: ./tests/ReviewAuthorityRecovery.Tests.ps1
