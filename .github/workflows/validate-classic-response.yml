name: Validate Classic Response Capture

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  classic-response-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository reload heartbeat culture regression
        shell: pwsh
        run: |
          $files=@('./tools/Reload-AidosAutonomousPreparation.ps1','./tests/HostAgentReload.Tests.ps1')
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "PowerShell parse errors in ${file}: $($errors.Message -join '; ')"}
          }
          ./tests/HostAgentReload.Tests.ps1
      - name: Actor response extraction regression
        shell: pwsh
        run: ./tests/DesktopActorResponseExtraction.Tests.ps1
      - name: Parent message-range recovery regression
        shell: pwsh
        run: ./tests/DesktopActorMessageRangeRecovery.Tests.ps1
      - name: Desktop review authority regression
        shell: pwsh
        run: ./tests/DesktopReviewAuthority.Tests.ps1
      - name: Independent review authority recovery regression
        shell: pwsh
        run: ./tests/ReviewAuthorityRecovery.Tests.ps1
