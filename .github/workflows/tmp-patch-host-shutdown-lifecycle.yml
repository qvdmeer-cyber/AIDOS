name: Temporary host shutdown lifecycle patcher

on:
  push:
    branches:
      - tmp/patch-host-shutdown-lifecycle

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/patch-host-shutdown-lifecycle
          fetch-depth: 0
      - name: Apply bounded lifecycle patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact {
            param([string]$Path,[string]$Old,[string]$New,[int]$Expected=1)
            $text = Get-Content -LiteralPath $Path -Raw -Encoding UTF8
            $count = ([regex]::Matches($text,[regex]::Escape($Old))).Count
            if($count -eq 0 -and $text.Contains($New)){ return }
            if($count -ne $Expected){ throw "$Path expected $Expected exact source match(es); found $count" }
            $text = $text.Replace($Old,$New)
            Set-Content -LiteralPath $Path -Value $text -Encoding utf8NoBOM -NoNewline
          }

          $installer = 'bridge/AidosRepositoryHandoffInstallation.psm1'
          Replace-Exact -Path $installer -Old '    exit $LASTEXITCODE' -New '    exit 0'

          $host = 'bridge/Invoke-AidosRepositoryHandoffHost.ps1'
          $oldStop = @'
          function Stop-AidosRepositoryHostTask {
              param([int]$TimeoutSeconds=15)
              $task=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if(-not$task){return}
              $stopPath=Get-AidosRepositoryHandoffHostPath -StateRoot $StateRoot -Kind stop
              $stopDir=Split-Path -Parent $stopPath
              if(-not(Test-Path -LiteralPath $stopDir -PathType Container)){New-Item -ItemType Directory -Path $stopDir -Force|Out-Null}
              Set-Content -LiteralPath $stopPath -Value ([DateTimeOffset]::UtcNow.ToString('o')) -Encoding utf8NoBOM
              try{$config=Read-AidosRepositoryHostConfiguration;Stop-AidosRepositoryHandoffBridge -StateRoot ([string]$config.bridge_state_root)|Out-Null;Stop-AidosRepositoryHandoffGateway -StateRoot ([string]$config.gateway_state_root)|Out-Null}catch{}
              $deadline=[DateTimeOffset]::UtcNow.AddSeconds($TimeoutSeconds)
              while([DateTimeOffset]::UtcNow-lt$deadline){
                  $current=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
                  if(-not$current -or [string]$current.State-ne'Running'){return}
                  Start-Sleep -Milliseconds 250
              }
              Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          }
          '@
          $newStop = @'
          function Stop-AidosRepositoryHostTask {
              param([int]$TimeoutSeconds=30)
              $task=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if(-not$task){return [pscustomobject][ordered]@{status='NOT_INSTALLED';previous_pid=$null;task_state=$null}}

              $leasePath=Get-AidosRepositoryHandoffHostPath -StateRoot $StateRoot -Kind lease
              $previousPid=0
              $previousStartedAt=$null
              if(Test-Path -LiteralPath $leasePath -PathType Leaf){
                  try{
                      $lease=Get-Content -LiteralPath $leasePath -Raw -Encoding UTF8|ConvertFrom-Json -Depth 20
                      if($lease.PSObject.Properties['pid']){$previousPid=[int]$lease.pid}
                      if($lease.PSObject.Properties['process_started_at']){$previousStartedAt=[DateTimeOffset]$lease.process_started_at}
                  }catch{}
              }

              $stopPath=Get-AidosRepositoryHandoffHostPath -StateRoot $StateRoot -Kind stop
              $stopDir=Split-Path -Parent $stopPath
              if(-not(Test-Path -LiteralPath $stopDir -PathType Container)){New-Item -ItemType Directory -Path $stopDir -Force|Out-Null}
              Set-Content -LiteralPath $stopPath -Value ([DateTimeOffset]::UtcNow.ToString('o')) -Encoding utf8NoBOM
              try{$config=Read-AidosRepositoryHostConfiguration;Stop-AidosRepositoryHandoffBridge -StateRoot ([string]$config.bridge_state_root)|Out-Null;Stop-AidosRepositoryHandoffGateway -StateRoot ([string]$config.gateway_state_root)|Out-Null}catch{}

              $deadline=[DateTimeOffset]::UtcNow.AddSeconds($TimeoutSeconds)
              do {
                  $leasePresent=Test-Path -LiteralPath $leasePath -PathType Leaf
                  $previousProcessAlive=$false
                  if($previousPid-gt0){
                      $process=Get-Process -Id $previousPid -ErrorAction SilentlyContinue
                      if($process){
                          if($null-ne$previousStartedAt){
                              $previousProcessAlive=$process.StartTime.ToUniversalTime().Ticks-eq$previousStartedAt.UtcDateTime.Ticks
                          }else{
                              $previousProcessAlive=$true
                          }
                      }
                  }
                  if(-not$leasePresent -and -not$previousProcessAlive){break}
                  Start-Sleep -Milliseconds 250
              }while([DateTimeOffset]::UtcNow-lt$deadline)

              $leaseStillPresent=Test-Path -LiteralPath $leasePath -PathType Leaf
              $previousProcessStillAlive=$false
              if($previousPid-gt0){
                  $process=Get-Process -Id $previousPid -ErrorAction SilentlyContinue
                  if($process){
                      if($null-ne$previousStartedAt){
                          $previousProcessStillAlive=$process.StartTime.ToUniversalTime().Ticks-eq$previousStartedAt.UtcDateTime.Ticks
                      }else{
                          $previousProcessStillAlive=$true
                      }
                  }
              }
              if($leaseStillPresent -or $previousProcessStillAlive){throw 'Repository handoff supervisor did not release its lease and terminate within the bounded shutdown window.'}

              $current=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if(-not$current){return [pscustomobject][ordered]@{status='STOPPED';previous_pid=if($previousPid-gt0){$previousPid}else{$null};task_state=$null}}
              if([string]$current.State-eq'Running'){Stop-ScheduledTask -TaskName $taskName -ErrorAction Stop}
              $taskDeadline=[DateTimeOffset]::UtcNow.AddSeconds(10)
              do {
                  $current=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
                  if(-not$current -or [string]$current.State-ne'Running'){break}
                  Start-Sleep -Milliseconds 250
              }while([DateTimeOffset]::UtcNow-lt$taskDeadline)
              $current=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              if($current -and [string]$current.State-eq'Running'){throw 'Repository handoff scheduled task remained Running after supervisor termination.'}
              [pscustomobject][ordered]@{status='STOPPED';previous_pid=if($previousPid-gt0){$previousPid}else{$null};task_state=if($current){[string]$current.State}else{$null}}
          }
          '@
          Replace-Exact -Path $host -Old $oldStop.Trim() -New $newStop.Trim()

          $reload = 'tools/Reload-AidosAutonomousPreparation.ps1'
          $reloadText = Get-Content -LiteralPath $reload -Raw -Encoding UTF8
          $anchor = @'
              $repositoryBootstrap=Join-Path $aidosRoot 'bridge/Invoke-AidosRepositoryHandoffHostBootstrap.ps1'
              if(-not(Test-Path -LiteralPath $repositoryBootstrap -PathType Leaf)){throw "Repository handoff host bootstrap is unavailable: $repositoryBootstrap"}
          '@.Trim()
          $replacement = @'
              $repositoryBootstrap=Join-Path $aidosRoot 'bridge/Invoke-AidosRepositoryHandoffHostBootstrap.ps1'
              if(-not(Test-Path -LiteralPath $repositoryBootstrap -PathType Leaf)){throw "Repository handoff host bootstrap is unavailable: $repositoryBootstrap"}
              $repositoryInstallation=Join-Path $aidosRoot 'bridge/AidosRepositoryHandoffInstallation.psm1'
              if(-not(Test-Path -LiteralPath $repositoryInstallation -PathType Leaf)){throw "Repository handoff installation module is unavailable: $repositoryInstallation"}
              Import-Module $repositoryInstallation -Force -DisableNameChecking
              $repositoryLauncher=Get-AidosRepositoryHandoffHostPath -StateRoot $repositoryHostStateRoot -Kind launcher
              New-AidosRepositoryHandoffLauncherText|Set-Content -LiteralPath $repositoryLauncher -Encoding utf8NoBOM
          '@.Trim()
          $anchorCount=([regex]::Matches($reloadText,[regex]::Escape($anchor))).Count
          if($anchorCount-eq1){$reloadText=$reloadText.Replace($anchor,$replacement)}elseif(-not$reloadText.Contains($replacement)){throw "reload launcher-refresh anchor count=$anchorCount"}

          $oldReloadStop = @'
                  & $repositoryBootstrap -Command Stop -StateRoot $repositoryHostStateRoot|Out-Null
                  $deadline=[DateTimeOffset]::UtcNow.AddSeconds(15)
                  do{
                      Start-Sleep -Milliseconds 250
                      $current=Get-ScheduledTask -TaskName $repositoryHostTaskName -ErrorAction SilentlyContinue
                      if(-not$current -or [string]$current.State -ne 'Running'){break}
                  }while([DateTimeOffset]::UtcNow -lt $deadline)
                  $current=Get-ScheduledTask -TaskName $repositoryHostTaskName -ErrorAction SilentlyContinue
                  if(-not$current){throw 'Repository handoff host scheduled task disappeared during reload.'}
                  if([string]$current.State -eq 'Running'){throw 'Repository handoff host scheduled task did not stop within the bounded reload window.'}
          '@.Trim()
          $newReloadStop = @'
                  $repositoryStop=& $repositoryBootstrap -Command Stop -StateRoot $repositoryHostStateRoot
                  $current=Get-ScheduledTask -TaskName $repositoryHostTaskName -ErrorAction SilentlyContinue
                  if(-not$current){throw 'Repository handoff host scheduled task disappeared during reload.'}
                  if([string]$current.State -eq 'Running'){throw 'Canonical Repository Handoff stop returned while the scheduled task was still Running.'}
          '@.Trim()
          $stopCount=([regex]::Matches($reloadText,[regex]::Escape($oldReloadStop))).Count
          if($stopCount-eq1){$reloadText=$reloadText.Replace($oldReloadStop,$newReloadStop)}elseif(-not$reloadText.Contains($newReloadStop)){throw "reload canonical-stop anchor count=$stopCount"}
          Set-Content -LiteralPath $reload -Value $reloadText -Encoding utf8NoBOM -NoNewline

          $installTest='tests/RepositoryHandoffInstallation.Tests.ps1'
          $installTestText=Get-Content -LiteralPath $installTest -Raw -Encoding UTF8
          $installAnchor="    Assert-Install (`$launcher.Contains('-Command Start -StateRoot `$root')) 'stable launcher starts the host from local configuration'"
          $installAddition=@"
          $installAnchor
              Assert-Install (`$launcher.Contains('    exit 0')) 'stable launcher treats normal host script return as success under StrictMode'
              Assert-Install (-not`$launcher.Contains('exit `$LASTEXITCODE')) 'stable launcher never depends on an unset LASTEXITCODE after PowerShell script return'
          "@.TrimEnd()
          if($installTestText.Contains($installAnchor) -and -not$installTestText.Contains('normal host script return as success')){$installTestText=$installTestText.Replace($installAnchor,$installAddition)}
          Set-Content -LiteralPath $installTest -Value $installTestText -Encoding utf8NoBOM -NoNewline

          $reloadTest='tests/HostAgentReload.Tests.ps1'
          $reloadTestText=Get-Content -LiteralPath $reloadTest -Raw -Encoding UTF8
          $reloadTestAnchor="Assert-Reload (`$text.IndexOf(\"Invoke-AidosRepositoryHandoffHostBootstrap.ps1\",[StringComparison]::Ordinal) -ge 0 -and `$text.IndexOf(\"-Command Stop -StateRoot `$repositoryHostStateRoot\",[StringComparison]::Ordinal) -ge 0) 'Repository Handoff reload stops the running host through its canonical bootstrap'"
          $reloadTestAddition=@"
          $reloadTestAnchor
          Assert-Reload (`$text.IndexOf('New-AidosRepositoryHandoffLauncherText|Set-Content',[StringComparison]::Ordinal) -ge 0) 'Repository Handoff reload refreshes the durable launcher before any restart'
          Assert-Reload (`$text.IndexOf('Canonical Repository Handoff stop returned while the scheduled task was still Running.',[StringComparison]::Ordinal) -ge 0) 'Repository Handoff reload trusts the canonical stop boundary and only verifies its postcondition'
          Assert-Reload (`$text.IndexOf('AddSeconds(15)',[StringComparison]::Ordinal) -lt 0) 'Repository Handoff reload no longer imposes a second shorter scheduler shutdown window'
          "@.TrimEnd()
          if($reloadTestText.Contains($reloadTestAnchor) -and -not$reloadTestText.Contains('refreshes the durable launcher')){$reloadTestText=$reloadTestText.Replace($reloadTestAnchor,$reloadTestAddition)}
          Set-Content -LiteralPath $reloadTest -Value $reloadTestText -Encoding utf8NoBOM -NoNewline

          $tokens=$null;$errors=$null
          foreach($p in @($installer,$host,$reload,$installTest,$reloadTest)){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "$p parse errors: $($errors.Message -join '; ')"}
          }
      - name: Run targeted regressions
        shell: pwsh
        run: |
          ./tests/RepositoryHandoffInstallation.Tests.ps1
          ./tests/HostAgentReload.Tests.ps1
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bridge/AidosRepositoryHandoffInstallation.psm1 bridge/Invoke-AidosRepositoryHandoffHost.ps1 tools/Reload-AidosAutonomousPreparation.ps1 tests/RepositoryHandoffInstallation.Tests.ps1 tests/HostAgentReload.Tests.ps1
          git commit -m "Harden repository host shutdown lifecycle"
          git push origin HEAD:tmp/patch-host-shutdown-lifecycle
