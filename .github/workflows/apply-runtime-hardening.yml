name: Apply Runtime Hardening

on:
  push:
    branches:
      - fix/review-evidence-and-self-update-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply exact desktop evidence patch
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          $modulePath='./bridge/AidosDesktopChatGPT.psm1'
          $patchPath='./tools/.AidosDesktopReviewEvidenceFunction.patch.txt'
          $source=[IO.File]::ReadAllText($modulePath)
          $replacement=[IO.File]::ReadAllText($patchPath).TrimEnd()+"`r`n`r`nfunction New-AidosDesktopChatGPTPrompt"
          $pattern='(?s)function Get-AidosDesktopChatGPTReviewEvidenceDocuments \{.*?\r?\n\}\r?\n\r?\nfunction New-AidosDesktopChatGPTPrompt'
          $matches=[regex]::Matches($source,$pattern)
          if($matches.Count -ne 1){throw "Expected exactly one desktop evidence function block, found $($matches.Count)."}
          $updated=[regex]::Replace($source,$pattern,[System.Text.RegularExpressions.MatchEvaluator]{param($m);$replacement},1)
          [IO.File]::WriteAllText($modulePath,$updated,[Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- $modulePath

      - name: Evidence chunking regression
        shell: pwsh
        run: ./tests/DesktopReviewEvidenceChunking.Tests.ps1

      - name: Hidden self-update launcher contract
        shell: pwsh
        run: ./tests/HostSelfUpdateContract.Tests.ps1

      - name: Mark host-only WSL path fixture unavailable on GitHub runner
        shell: pwsh
        run: |
          $path='./tests/PORTABILITY.json'
          $config=Get-Content -LiteralPath $path -Raw -Encoding UTF8|ConvertFrom-Json -AsHashtable
          $config.windows_candidate_validation_skip['WindowsPath.Tests.ps1']='GitHub-hosted Windows has no Ubuntu WSL distribution; authoritative host validation still runs this unchanged test.'
          $config|ConvertTo-Json -Depth 20|Set-Content -LiteralPath $path -Encoding utf8NoBOM

      - name: Portable Core validation
        shell: pwsh
        run: ./tools/Test-AidosCorePortable.ps1 -RepoRoot .

      - name: Commit validated desktop module patch
        shell: pwsh
        run: |
          git checkout -- tests/PORTABILITY.json
          git diff --check
          git config user.email 'aidos-hardening@example.invalid'
          git config user.name 'AIDOS Hardening Validation'
          git add -- bridge/AidosDesktopChatGPT.psm1
          if(git diff --cached --quiet){throw 'Validated desktop evidence patch produced no staged change.'}
          git commit -m 'Chunk oversized desktop review evidence'
          $target='${{ github.event_name == ''pull_request'' && github.event.pull_request.head.ref || github.ref_name }}'
          git push origin HEAD:$target
